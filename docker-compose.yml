services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quantsaas}
      POSTGRES_USER: ${POSTGRES_USER:-quantsaas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  saas:
    build:
      context: .
      dockerfile: saas.Dockerfile
    restart: unless-stopped
    environment:
      APP_ROLE: ${APP_ROLE:-saas}
      B_ALPHA_APP_ROLE: ${APP_ROLE:-saas}
      B_ALPHA_DB_HOST: postgres
      B_ALPHA_DB_PORT: "5432"
      B_ALPHA_DB_USER: ${POSTGRES_USER:-quantsaas}
      B_ALPHA_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      B_ALPHA_DB_NAME: ${POSTGRES_DB:-quantsaas}
      B_ALPHA_DB_SSL_MODE: disable
      B_ALPHA_DB_TIMEZONE: ${B_ALPHA_DB_TIMEZONE:-Asia/Shanghai}
      B_ALPHA_REDIS_ADDR: redis:6379
      B_ALPHA_JWT_SECRET: ${B_ALPHA_JWT_SECRET:?set B_ALPHA_JWT_SECRET in .env}
      B_ALPHA_SERVER_HOST: 0.0.0.0
      B_ALPHA_SERVER_PORT: "8080"
      B_ALPHA_SERVER_MODE: ${B_ALPHA_SERVER_MODE:-release}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  redis_data:
